<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1414" viewBox="0 0 1000 1414" data-atlas="design-style-atlas/layout/annotation-layer" data-version="0.1-draft">
  <!-- 落盘时复核项：图层 id 与 hex 须与 layout/grid-annotation.md 第 1 节一致；无其他外部依赖。 -->
  <title>design-style-atlas 标注图层模板（annotation-layer）</title>
  <desc>复制本文件后：把 width/height/viewBox 改为原图像素尺寸；在 #source 内填外部图片链接；删除所有 data-placeholder="true" 的占位几何体。图层色码与标签格式见 layout/grid-annotation.md。颜色为屏幕标注色，非印刷规格。</desc>
  <defs>
    <marker id="eye-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker>
    <style>
      .lbl { font-family: "Helvetica Neue", Arial, "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 17px; }
      .lead { stroke-width: 0.5; fill: none; }
      .lg { font-family: "Helvetica Neue", Arial, "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 15px; fill: #222222; }
    </style>
  </defs>
  <g id="source" data-layer="原图" data-note="外部链接引用，不嵌入原图">
