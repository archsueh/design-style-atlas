    <rect x="0" y="0" width="1000" height="1414" fill="#FAFAF7" data-placeholder="true"/>
    <!-- <image href="https://…/source.jpg" x="0" y="0" width="W" height="H" preserveAspectRatio="none"/> -->
  </g>
  <g id="PG" data-layer="外框" stroke="#6E6E6E" stroke-width="1" fill="none">
