  </g>
  <g id="AX" data-layer="对齐轴" stroke="#E69F00" stroke-width="1.25" stroke-dasharray="10 3 2 3" fill="none">
    <line x1="380.0" y1="40" x2="380.0" y2="1280" data-placeholder="true"/>
    <line x1="40" y1="230" x2="960" y2="230" data-placeholder="true"/>
