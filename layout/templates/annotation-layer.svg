  <g id="legend" data-layer="图例" transform="translate(620,1262)">
    <rect x="0" y="0" width="360" height="140" fill="#FFFFFF" fill-opacity="0.92" stroke="#222222" stroke-width="0.5"/>
    <text class="lg" x="10" y="18" font-weight="bold">图例 · 标签格式 [层]-[序号] 键=值</text>
