    <text class="lbl" x="116.0" y="112" fill="#1F6F99" fill-opacity="1" stroke="none" data-placeholder="true">COL-1 w=240px gutter=30px</text>
    <text class="lbl" x="386.0" y="112" fill="#1F6F99" fill-opacity="1" stroke="none" data-placeholder="true">COL-2 w=240px gutter=30px</text>
